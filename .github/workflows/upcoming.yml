name: Upcoming Releases

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly, Monday 6:00 AM UTC — premieres don't change daily
  workflow_dispatch:       # Allow manual trigger for testing/debugging

concurrency:
  group: upcoming-weekly
  cancel-in-progress: false

jobs:
  scrape-upcoming:
    name: Scrape preorder/upcoming-release listings
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install scraper dependencies
        run: cd scraper && uv sync

      - name: Run upcoming-release spiders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: |
          cd scraper
          # AutoThrottle passed via -s: each store's dedicated preorder page is
          # paginated (~15 pages for AlePlanszowki, ~11 for 3Trolle at Story 8.1's
          # spike time) — scoped to this workflow's runs, not settings.py's global
          # defaults, since the daily scraper.yml spiders don't need it at their
          # much smaller per-run page count.
          for spider in ale_planszowki_upcoming three_trolle_upcoming; do
            echo "--- Running spider: $spider ---"
            uv run scrapy crawl "$spider" -s AUTOTHROTTLE_ENABLED=True || echo "::warning::Spider $spider exited with non-zero code"
          done
