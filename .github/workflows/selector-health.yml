name: Selector Health Check

on:
  schedule:
    - cron: '0 8 * * *'  # Daily 8:00 AM UTC
  workflow_dispatch:

jobs:
  selector-health:
    name: Live selector smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: cd scraper && uv sync

      - name: Run live selector tests
        run: cd scraper && uv run pytest -m live tests/test_live_selectors.py -v
