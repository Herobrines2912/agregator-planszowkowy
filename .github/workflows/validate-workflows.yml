name: Validate Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  validate-timeouts:
    name: Check scraper.yml timeout-minutes <= 360
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Validate timeout constraints (NFR-2)
        run: |
          python3 - <<'EOF'
          import yaml, sys, os

          TARGET = '.github/workflows/scraper.yml'
          # Raised from 14 to 360 as the scraper scope grew (more stores + BGG
          # enrichment) — see git history of scraper.yml's timeout-minutes.
          LIMIT = 360

          if not os.path.exists(TARGET):
              print(f"WARNING: {TARGET} not yet created — skipping timeout check")
              sys.exit(0)

          with open(TARGET) as f:
              data = yaml.safe_load(f)

          jobs = data.get('jobs', {})
          errors = []

          for job_name, job in jobs.items():
              timeout = job.get('timeout-minutes')
              if timeout is None:
                  errors.append(
                      f"  Job '{job_name}': no timeout-minutes set "
                      f"(required: <= {LIMIT}, NFR-2)"
                  )
              elif int(timeout) > LIMIT:
                  errors.append(
                      f"  Job '{job_name}': timeout-minutes={timeout} "
                      f"exceeds limit of {LIMIT} (NFR-2 violation)"
                  )

          if errors:
              print("FAILED: Workflow timeout validation FAILED:")
              for e in errors:
                  print(e)
              sys.exit(1)

          print(f"OK: All {len(jobs)} job(s) in {TARGET} have timeout-minutes <= {LIMIT}")
          EOF
