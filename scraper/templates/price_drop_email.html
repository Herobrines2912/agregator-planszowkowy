<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Cena spadła!</title>
</head>
<body style="margin:0; padding:0; background-color:#F2EAD8; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F2EAD8; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; padding:32px;">
          <tr>
            <td>
              <h1 style="color:#3D5C3A; font-size:22px; margin:0 0 16px;">Cena spadła!</h1>
              <p style="color:#2C1F14; font-size:16px; line-height:1.5; margin:0 0 8px;">
                Gra <strong>{{game_name}}</strong> jest teraz dostępna za:
              </p>
              <p style="color:#3D5C3A; font-size:32px; font-weight:bold; margin:0 0 8px;">
                {{current_price}} zł
              </p>
              <p style="color:#6b6258; font-size:14px; margin:0 0 8px;">
                Twój cel: {{target_price}} zł
              </p>
              <p style="color:#6b6258; font-size:14px; margin:0 0 24px;">
                Sklep: {{store_name}}
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color:#3D5C3A; border-radius:8px;">
                    <a href="{{buy_url}}" style="display:inline-block; padding:14px 28px; color:#ffffff; font-size:16px; font-weight:bold; text-decoration:none;">Kup teraz →</a>
                  </td>
                </tr>
              </table>
              <p style="color:#6b6258; font-size:13px; line-height:1.5; margin:32px 0 0;">
                Poprosiłeś o powiadomienie o cenie dla gry {{game_name}}.
              </p>
              <p style="color:#6b6258; font-size:13px; line-height:1.5; margin:8px 0 0;">
                <a href="{{game_url}}" style="color:#6b6258;">Wyłącz powiadomienia</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
